<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>InkaTech Studio</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="inka-header">
    <div class="inka-brand-title">
      <span class="inka-brand-icon">⚡</span>
      <span>Inka Studio</span>
    </div>
    <span class="inka-badge">v4.5.2</span>
  </header>

  <main class="inka-container">
    <div>
      <div class="inka-label">
        <span>Profil Akun</span>
        <span id="txtAccountTag" class="inka-badge-blue">01 - 20</span>
      </div>
      <select id="selAccountMode" class="inka-select">
        <option value="acc1">Akun 1 (Topik 01 - 20)</option>
        <option value="acc2">Akun 2 (Topik 21 - 40)</option>
        <option value="all">Semua Akun (Topik 01 - 40)</option>
      </select>
    </div>

    <div>
      <div class="inka-label">
        <span>Topik</span>
        <div style="display: flex; gap: 8px; align-items: center;">
          <span id="txtResume" style="color:#0284C7; font-size: 11px;">Lanjutkan</span>
          <button id="btnResetTopic" class="inka-btn-reset-mini" title="Reset progres & gambar topik saat ini">↺ Reset</button>
        </div>
      </div>
      <select id="selTopic" class="inka-select"></select>
    </div>

    <div class="inka-card">
      <div id="txtHook" class="inka-hook-text">Memuat topik...</div>
      <div class="inka-progress-row">
        <span id="txtProgress">0/6 Selesai</span>
        <span id="txtPercent">0%</span>
      </div>
      <div class="inka-progress-bar">
        <div id="barFill" class="inka-progress-fill" style="width: 0%;"></div>
      </div>
      <div class="inka-engine-status">
        <span id="badgeEngineState" class="inka-badge-idle">● IDLE</span>
        <span id="txtEngineDetail" class="inka-engine-text">Menunggu instruksi</span>
      </div>
    </div>

    <div>
      <div class="inka-label">Slide</div>
      <div id="stripSlides" class="inka-slide-strip"></div>
    </div>

    <div>
      <div id="txtOutline" class="inka-outline-tag"></div>
      <div id="boxPrompt" class="inka-prompt-preview"></div>
    </div>

    <div class="inka-btn-grid">
      <button id="btnAutopilot" class="inka-btn inka-btn-primary">
        ⚡ Autopilot
      </button>
      <button id="btnSend" class="inka-btn inka-btn-secondary">
        Kirim
      </button>
    </div>

    <div class="inka-btn-grid-3">
      <button id="btnCopy" class="inka-btn inka-btn-secondary">
        Salin
      </button>
      <button id="btnNewChat" class="inka-btn inka-btn-accent">
        New Chat
      </button>
      <button id="btnCaption" class="inka-btn inka-btn-secondary">
        Caption
      </button>
    </div>

    <div class="inka-card" style="padding: 10px;">
      <div class="inka-label" style="margin-bottom: 8px;">
        <span>Unduh Gambar (DALL-E)</span>
        <div style="display: flex; gap: 5px; align-items: center;">
          <span id="txtImageCount" class="inka-badge-blue">0 Gambar</span>
          <span id="txtDownloadedSummary" class="inka-badge-verified">0/0 Terunduh</span>
          <button id="btnResetImages" class="inka-btn-reset-mini" title="Hapus daftar gambar terdeteksi untuk topik ini">↺ Reset</button>
        </div>
      </div>

      <div class="inka-btn-grid" style="margin-bottom: 8px;">
        <button id="btnScanTab" class="inka-btn inka-btn-secondary" title="Pindai gambar DALL-E yang sudah selesai di tab ChatGPT">
          🔍 Pindai Tab
        </button>
        <button id="btnDownloadAll" class="inka-btn inka-btn-primary" title="Unduh gambar yang belum terunduh">
          📥 Unduh Semua
        </button>
      </div>

      <div class="inka-cdn-container">
        <div id="listDownloadItems" class="inka-cdn-list">
          <div class="inka-empty-hint">Klik '🔍 Pindai Tab' untuk mendeteksi gambar.</div>
        </div>
      </div>
    </div>
  </main>

  <footer id="txtStatus" class="inka-footer-status">
    Siap
  </footer>

  <script src="topics.js"></script>
  <script src="state.js"></script>
  <script src="dom_scanner.js"></script>
  <script src="ui_controller.js"></script>
  <script src="downloader.js"></script>
  <script src="autopilot.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
